 server {
    listen 80;
    listen [::]:80;
    
    # This is the directory in which we had copied the static content generated on build of frontend so we point to that . See the frontend Dockerfile

    root /etc/nginx/sites-available/dist;
    index index.html;
    server_name uras.aryan26.dev;

    # proxy it to backend any req that hits /api/
    location /api/ {
        proxy_pass http://backend:3000;
    }
    #location / {
     #   try_files $uri $uri/ index.html;
    #}
}