# No need of entire http and event block since main config includes this file inside http block only so no issue
server {
    listen 80;
    listen [::]:80;

    server_name uras.aryan26.dev;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name uras.aryan26.dev;
    root /etc/nginx/sites-available/dist;
    index index.html;

    # ssl_protocols TLSv1.3;
    # TODO - Add ssl certificates and all
    # ssl_certificate /path/to/certificate;
    # ssl_certificate_key /path/to/key;

    # Proxy Pass to backend
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
    }
    # Those that dont match anyone come here
    location / {
        try_files $uri $uri/ /index.html;
    }
}


