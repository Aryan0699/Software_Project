server {
    listen 80;
    # This identifies the hostname for which this server block should handle requests.
    server_name localhost; 

    location / {

        # This tell which idrectory to look for req - adds /usr/share/nginx/html/uri_remaining_path
        root /usr/share/nginx/html;
        # This tells Nginx to look for index.html file in the root directory if no specific file is requested.
        index index.html;
        
        # Try to see if the requested file exists, if not, serve index.html (for SPA routing)
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # If any error is encountered, serve the 50x.html page which is a generic error page.
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;        
    }
}


