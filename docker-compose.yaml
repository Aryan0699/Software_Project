# Final Docker Compose
name: uras
services:
  postgres:

    # Prebuilt image from Docker Hub.
    image: postgres:16-alpine
    restart: unless-stopped

    # Compose reads values from the shell or project environment file. Avoid hard-coding credentials in Compose.
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Named volume — persistent storage.
    volumes:
      - uras_postgres_data:/var/lib/postgresql/data
    # Check whether the container is running and healthy, similar to how a load balancer checks server health using heartbeats.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    # Since there is no prebuilt image, we provide the Dockerfile as a blueprint for building the image using its instructions.
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Another way to specify the environment file directly here instead of in the terminal.
    # .env is the default; we will use .env.production when deploying.
    env_file:
      - ${APP_ENV_FILE:-.env}
    # The backend needs the database to be ready before it can connect, so it waits until PostgreSQL is healthy.
    depends_on:
      postgres:
        condition: service_healthy

    # Locally, we used migrations to apply changes (npm run prisma:migrate). Why do we use deploy here?
    # Would have npm run start before the deploy command cause issue?? - find it yourself
    command: ["sh","-c","npm run prisma:deploy && npm run start"]
    # A similar health check to verify that the backend is running.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/v1/health/ready')
          .then(r => process.exit(r.ok ? 0 : 1))
          .catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s


  frontend:
    # Build the image from its Dockerfile.
    build:
      # Specify which directory to use as the build context.
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1

    restart: unless-stopped

    environment:
      URAS_DOMAIN: ${URAS_DOMAIN}

    depends_on:
      backend:
        condition: service_healthy
    # Notice that we have not published the backend or database ports, but we have published the frontend ports.
    # From outside, only the frontend served by NGINX is directly accessible.
    # The backend and database are not directly reachable from outside because their ports are not published.
    # Since all three services share a Docker network, NGINX can contact the backend,
    # and the backend can contact PostgreSQL without publishing their ports.
    # This provides security because nobody from outside would be able to access the backend and we can limit the access as wel by blocking things at nginx
    ports:
      - "${HTTP_PORT}:80"
      - "443:443"

    # Read-only bind mount — different from a named volume.
    # A bind mount maps a directory on the host machine to a directory inside the container.
    # NGINX inside the frontend container needs access to the TLS certificates which will be installed on the host machine.
    # This mount makes them available inside the container without allowing container writes.
    # ro - readonly
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro

# Define the named volumes here.
volumes:
  uras_postgres_data:

